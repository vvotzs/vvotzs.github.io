# 每日重建工作流（模板）
#
# 用途：每天按北京时间把数据重新过一遍状态（进行中 / 即将截止 / 已归档），
#       重新生成 index.html、sitemap.xml，并把新收录域名的图标下载到 assets/fav/。
#       内容采集本身由 Pickle 的定时任务完成，这里只做「日期滚动 + 页面重建」。
#
# 放置方式：复制到仓库的 .github/workflows/daily-rebuild.yml（通过 GitHub 网页
#           上传或编辑，不要用缺 workflow 权限的 App 直接推），保存即生效。
#
# 注意：本文件只是模板，放在 docs/workflows-reference/ 下不会被 GitHub 执行。

name: daily-rebuild

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC；22:10 UTC = 次日 06:10 北京时间
    - cron: "10 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (favicon / OG 图处理)
        run: pip install --disable-pip-version-check pillow

      - name: Maintain data (dedupe / status / archive / sitemap)
        run: python3 scripts/maintain_deals.py

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: 每日重建（状态刷新 / 图标缓存 / index.html）"
          git push
